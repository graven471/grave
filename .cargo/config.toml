[build]
target = "x86_64-unknown-none"

[alias]
xtask = "run --manifest-path xtask/Cargo.toml --target x86_64-unknown-linux-gnu --"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker/x86_64.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-Map=target/grave.map",
]
